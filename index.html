<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMOS MEDIACUBE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col font-sans overflow-hidden">

    <header class="w-full px-8 py-6 flex items-center justify-between border-b border-gray-100 bg-white/80 backdrop-blur sticky top-0 z-40 shrink-0">
        <button id="home-btn" class="text-xl font-semibold tracking-wider text-gray-900 hover:text-blue-600 transition text-left flex items-center gap-2 cursor-pointer">
            MEDIA CUBE
        </button>
        
        <div class="flex items-center gap-4">
            <button id="mypage-btn" class="hidden bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-200 px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer">
                My Page
            </button>

            <label id="upload-container" class="hidden cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                <button id="open-upload-modal" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm cursor-pointer">
                    Upload Media
                </button>
                <input type="file" id="file-upload" accept="application/pdf,image/*" class="hidden">
            </label>

            <div id="auth-section">
                <button id="open-auth-modal" class="bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-200 px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer">
                    Log In / Sign Up
                </button>
            </div>
        </div>

        <div id="navigation-controls" class="hidden items-center gap-3">
            <button id="prev-page" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 px-3 py-1.5 rounded-lg text-sm disabled:opacity-50 transition cursor-pointer">Previous</button>
            <span class="text-sm text-gray-600">Page <span id="current-page">1</span>-<span id="current-page-right">2</span> of <span id="total-pages">1</span></span>
            <button id="next-page" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 px-3 py-1.5 rounded-lg text-sm disabled:opacity-50 transition cursor-pointer">Next</button>
        </div>
    </header>

    <div id="auth-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white border border-gray-200 p-8 rounded-2xl w-full max-w-md shadow-2xl relative">
            <button id="close-auth-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl cursor-pointer">&times;</button>
            <h3 id="auth-title" class="text-xl font-bold mb-6 text-gray-900">Log In to Upload</h3>
            
            <form id="auth-form" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs text-gray-600 mb-1.5 font-medium">Email</label>
                    <input type="email" id="auth-email" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm text-gray-900 focus:border-blue-600 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1.5 font-medium">Password</label>
                    <input type="password" id="auth-password" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm text-gray-900 focus:border-blue-600 outline-none transition">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium transition text-sm shadow-sm mt-2 cursor-pointer">
                    Log In
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-gray-500">
                <span id="auth-toggle-text">Don't have an account?</span>
                <button id="auth-toggle-mode" class="text-blue-600 hover:underline ml-1 font-semibold cursor-pointer">Sign Up</button>
            </div>
        </div>
    </div>

    <div id="upload-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white border border-gray-200 p-8 rounded-2xl w-full max-w-md shadow-2xl relative">
            <button id="close-upload-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl cursor-pointer">&times;</button>
            <h3 class="text-xl font-bold mb-6 text-gray-900">Upload Media</h3>
            
            <form id="upload-form" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs text-gray-600 mb-1.5 font-medium">Select File (PDF or Image)</label>
                    <input type="file" id="modal-file-input" accept="application/pdf,image/*" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm text-gray-900 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-600 hover:file:bg-blue-100 outline-none transition cursor-pointer">
                </div>

                <div class="relative">
                    <label class="block text-xs text-gray-600 mb-1.5 font-medium">Connect to Society</label>
                    
                    <button type="button" id="dropdown-trigger" class="w-full bg-white border border-gray-200 rounded-xl p-3 text-sm text-gray-700 flex items-center justify-between focus:border-blue-600 outline-none transition cursor-pointer">
                        <span id="dropdown-selected-text">-- None (No Society Tag) --</span>
                        <svg class="w-4 h-4 text-gray-400 transition-transform duration-200" id="dropdown-arrow" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    </button>

                    <div id="dropdown-menu" class="hidden absolute top-full left-0 w-full mt-1.5 bg-white border border-gray-200 rounded-xl shadow-xl max-h-48 overflow-y-auto z-50 p-1 flex flex-col gap-0.5">
                        <div data-value="" class="society-option px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg cursor-pointer transition">-- None (No Society Tag) --</div>
                    </div>
                </div>

                <div id="selected-tag-container" class="hidden flex items-center gap-2 mt-1">
                    <span class="text-xs text-gray-500">Selected Tag:</span>
                    <span id="society-tag-badge" class="bg-blue-50 text-blue-700 border border-blue-200 text-xs px-2.5 py-1 rounded-full font-medium flex items-center gap-1">
                        <span id="tag-text"></span>
                        <button type="button" id="remove-tag-btn" class="hover:text-red-600 font-bold ml-1 cursor-pointer">&times;</button>
                    </span>
                </div>

                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="terms-checkbox" required class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
                    <label for="terms-checkbox" class="text-xs text-gray-600 select-none">I agree to the terms and publication guidelines</label>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium transition text-sm shadow-sm mt-2 cursor-pointer">
                    Upload Publication
                </button>
            </form>
        </div>
    </div>

    <main class="flex-1 flex flex-col items-center p-8 overflow-auto relative">
        
        <div id="homescreen-view" class="w-full max-w-4xl flex flex-col items-center mt-12 transition-all">
            <h1 id="view-title" class="text-4xl font-semibold tracking-tight text-gray-900 mb-2">MEDIA CUBE</h1>
            <p id="view-subtitle" class="text-sm text-gray-500 mb-8">Powered by COSMOS</p>
            
            <div id="search-container" class="w-full flex flex-col items-center mb-8 px-4">
                <div class="w-full relative">
                    <input type="text" id="search-input" placeholder="Search files..." class="w-full bg-gray-50 border border-gray-200 rounded-full px-6 py-3.5 text-sm text-gray-900 placeholder-gray-400 focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none shadow-sm transition">
                </div>
                <p class="text-[11px] font-light uppercase tracking-widest text-gray-400 mt-3 pt-1 text-center w-full">POWERED BY COSMOS</p>
            </div>

            <div id="files-section" class="w-full flex flex-col gap-3 transition-all duration-300">
                <div id="pdf-list" class="grid grid-cols-1 sm:grid-cols-5 gap-4 w-full"></div>
            </div>
        </div>

        <div id="reader-view" class="hidden flex-col items-center justify-center w-full h-full absolute inset-0 bg-white z-30 p-4">
            
            <button id="floating-prev" class="hidden fixed left-6 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white text-gray-800 border border-gray-200 p-3 rounded-full shadow-lg transition z-40 items-center justify-center backdrop-blur cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <button id="floating-next" class="hidden fixed right-6 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white text-gray-800 border border-gray-200 p-3 rounded-full shadow-lg transition z-40 items-center justify-center backdrop-blur cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
            </button>

            <div id="pdf-container" class="hidden shadow-xl bg-white rounded-xl overflow-hidden border border-gray-200 max-h-[calc(100vh-140px)] flex items-center justify-center gap-2 p-2">
                <canvas id="pdf-canvas-left" class="max-h-[calc(100vh-160px)] w-auto object-contain"></canvas>
                <canvas id="pdf-canvas-right" class="max-h-[calc(100vh-160px)] w-auto object-contain hidden"></canvas>
            </div>
            <img id="media-img" class="hidden max-h-[calc(100vh-140px)] max-w-full shadow-xl rounded-xl object-contain bg-gray-50" alt="Media Preview">
        </div>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://vyfyhxirpmptnoipzsvm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5ZnloeGlycG1wdG5vaXB6c3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5OTUxNzQsImV4cCI6MjEwMzU3MTE3NH0.GmR_cUgMP9TzpMotCh-DmPseUgyCSNoVaNsEhN5OEMo';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedSociety = "";

        // Elements for Upload Modal & Custom Dropdown
        const uploadModal = document.getElementById('upload-modal');
        const openUploadModalBtn = document.getElementById('open-upload-modal');
        const closeUploadModalBtn = document.getElementById('close-upload-modal');
        const uploadForm = document.getElementById('upload-form');
        
        const dropdownTrigger = document.getElementById('dropdown-trigger');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const dropdownArrow = document.getElementById('dropdown-arrow');
        const dropdownSelectedText = document.getElementById('dropdown-selected-text');
        const tagContainer = document.getElementById('selected-tag-container');
        const tagText = document.getElementById('tag-text');
        const removeTagBtn = document.getElementById('remove-tag-btn');

        // Helper function to validate NLCS email domains
        function isValidNlcsEmail(email) {
            const lowerEmail = email.toLowerCase().trim();
            return lowerEmail.endsWith('@nlcsjeju.kr') || lowerEmail.endsWith('@pupils.nlcsjeju.kr');
        }

        // Open Upload Modal & Fetch Societies
        openUploadModalBtn.addEventListener('click', async () => {
            uploadModal.classList.remove('hidden');
            await fetchSocietiesForDropdown();
        });

        closeUploadModalBtn.addEventListener('click', () => {
            uploadModal.classList.add('hidden');
            uploadForm.reset();
            selectedSociety = "";
            dropdownSelectedText.textContent = "-- None (No Society Tag) --";
            tagContainer.classList.add('hidden');
            dropdownMenu.classList.add('hidden');
        });

        // Toggle custom dropdown menu open/close
        dropdownTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('hidden');
            dropdownArrow.classList.toggle('rotate-180');
        });

        // Close dropdown when clicking outside
        window.addEventListener('click', () => {
            dropdownMenu.classList.add('hidden');
            dropdownArrow.classList.remove('rotate-180');
        });

        // Fetch societies from Supabase 'society-names' table and populate custom list
        async function fetchSocietiesForDropdown() {
            const { data, error } = await supabase.from('society-names').select('society-name').order('society-name', { ascending: true });
            
            if (error) {
                console.error('Error fetching societies:', error.message);
                return;
            }

            dropdownMenu.innerHTML = `<div data-value="" class="society-option px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg cursor-pointer transition">-- None (No Society Tag) --</div>`;
            
            if (data) {
                data.forEach(item => {
                    const name = item['society-name'];
                    const optionDiv = document.createElement('div');
                    optionDiv.setAttribute('data-value', name);
                    optionDiv.className = 'society-option px-3 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 rounded-lg cursor-pointer transition';
                    optionDiv.textContent = name;
                    dropdownMenu.appendChild(optionDiv);
                });
            }

            // Attach click event listeners to custom options
            document.querySelectorAll('.society-option').forEach(option => {
                option.addEventListener('click', (e) => {
                    selectedSociety = e.target.getAttribute('data-value');
                    dropdownSelectedText.textContent = selectedSociety || "-- None (No Society Tag) --";
                    
                    if (selectedSociety) {
                        tagText.textContent = selectedSociety;
                        tagContainer.classList.remove('hidden');
                    } else {
                        tagContainer.classList.add('hidden');
                    }
                    dropdownMenu.classList.add('hidden');
                    dropdownArrow.classList.remove('rotate-180');
                });
            });
        }

        // Remove tag manually via 'X' button
        removeTagBtn.addEventListener('click', () => {
            selectedSociety = "";
            dropdownSelectedText.textContent = "-- None (No Society Tag) --";
            tagContainer.classList.add('hidden');
        });

        // Handle Form Submission & Upload
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('modal-file-input');
            const file = fileInput.files[0];
            const termsChecked = document.getElementById('terms-checkbox').checked;

            if (!file || !termsChecked) return;

            const { data: { session } } = await supabase.auth.getSession();
            if (!session || !isValidNlcsEmail(session.user.email)) {
                alert('Access denied: You must be logged in with an @nlcsjeju.kr or @pupils.nlcsjeju.kr account to upload.');
                return;
            }

            const fileExists = allFiles.some(f => f.name.toLowerCase() === file.name.toLowerCase());
            if (fileExists) {
                alert('This file already exists in the library. Duplicate uploads are not allowed.');
                return;
            }

            const userEmail = session.user.email;
            const sanitizedName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
            const filePath = `${Date.now()}_${sanitizedName}`;

            const { error: uploadError } = await supabase.storage.from('pdfs').upload(filePath, file);
            if (uploadError) {
                alert('Upload failed: ' + uploadError.message);
                return;
            }

            const { data: publicUrlData } = supabase.storage.from('pdfs').getPublicUrl(filePath);
            
            const { error: dbError } = await supabase.from('pdf_files').insert([{
                name: file.name,
                file_url: publicUrlData.publicUrl,
                uploaded_by: userEmail,
                society_tag: selectedSociety || null 
            }]);

            if (dbError) {
                alert('Database save failed: ' + dbError.message);
                return;
            }

            uploadModal.classList.add('hidden');
            uploadForm.reset();
            selectedSociety = "";
            dropdownSelectedText.textContent = "-- None (No Society Tag) --";
            tagContainer.classList.add('hidden');
            loadPublicLibrary();
        });

        let pdfDoc = null, pageNum = 1;
        let isSignUpMode = false;
        let allFiles = []; 
        let currentViewMode = 'home'; 
        let currentUserEmail = null;
        
        const canvasLeft = document.getElementById('pdf-canvas-left');
        const ctxLeft = canvasLeft.getContext('2d');
        const canvasRight = document.getElementById('pdf-canvas-right');
        const ctxRight = canvasRight.getContext('2d');
        
        const imgElement = document.getElementById('media-img');
        const searchInput = document.getElementById('search-input');
        const filesSection = document.getElementById('files-section');

        searchInput.addEventListener('focus', () => {
            filesSection.classList.add('opacity-0', 'pointer-events-none', 'scale-95');
        });

        searchInput.addEventListener('blur', () => {
            if (searchInput.value.trim() === '') {
                filesSection.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
            }
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        async function checkUserSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session && !isValidNlcsEmail(session.user.email)) {
                // Force logout if an unauthorized email is detected
                await supabase.auth.signOut();
                currentUserEmail = null;
                updateAuthUI(null);
                return;
            }
            currentUserEmail = session ? session.user.email : null;
            updateAuthUI(session);
        }

        supabase.auth.onAuthStateChange((event, session) => {
            if (session && !isValidNlcsEmail(session.user.email)) {
                supabase.auth.signOut();
                alert('Access restricted to @nlcsjeju.kr and @pupils.nlcsjeju.kr accounts only.');
                return;
            }
            currentUserEmail = session ? session.user.email : null;
            updateAuthUI(session);
        });

        function updateAuthUI(session) {
            const authSection = document.getElementById('auth-section');
            const uploadContainer = document.getElementById('upload-container');
            const myPageBtn = document.getElementById('mypage-btn');

            if (session) {
                authSection.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-gray-600 hidden sm:inline font-medium">${escapeHtml(session.user.email)}</span>
                        <button id="logout-btn" class="bg-red-50 text-red-600 hover:bg-red-100 px-3 py-2 rounded-xl text-xs font-medium transition cursor-pointer">Log Out</button>
                    </div>
                `;
                uploadContainer.classList.remove('hidden');
                myPageBtn.classList.remove('hidden');
                document.getElementById('logout-btn').addEventListener('click', async () => {
                    await supabase.auth.signOut();
                    switchToHome();
                });
            } else {
                authSection.innerHTML = `
                    <button id="open-auth-modal" class="bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-200 px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer">
                        Log In / Sign Up
                    </button>
                `;
                uploadContainer.classList.add('hidden');
                myPageBtn.classList.add('hidden');
                if (currentViewMode === 'mypage') switchToHome();
                document.getElementById('open-auth-modal').addEventListener('click', () => {
                    document.getElementById('auth-modal').classList.remove('hidden');
                });
            }
        }

        document.getElementById('close-auth-modal').addEventListener('click', () => {
            document.getElementById('auth-modal').classList.add('hidden');
        });

        document.getElementById('auth-toggle-mode').addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').textContent = isSignUpMode ? 'Create an Account' : 'Log In to Upload';
            document.getElementById('auth-submit-btn').textContent = isSignUpMode ? 'Sign Up' : 'Log In';
            document.getElementById('auth-toggle-text').textContent = isSignUpMode ? 'Already have an account?' : "Don't have an account?";
            document.getElementById('auth-toggle-mode').textContent = isSignUpMode ? 'Log In' : 'Sign Up';
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            // Check email domain validity before sending request
            if (!isValidNlcsEmail(email)) {
                alert('Only @nlcsjeju.kr or @pupils.nlcsjeju.kr email accounts are allowed.');
                return;
            }

            if (isSignUpMode) {
                const { error } = await supabase.auth.signUp({ email, password });
                if (error) alert('Sign up failed: ' + error.message);
                else {
                    alert('Check your email for confirmation or log in if confirmation is disabled.');
                    document.getElementById('auth-modal').classList.add('hidden');
                }
            } else {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) alert('Login failed: ' + error.message);
                else {
                    document.getElementById('auth-modal').classList.add('hidden');
                }
            }
        });

        async function loadPublicLibrary() {
            const { data, error } = await supabase.from('pdf_files').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error('Error loading library:', error.message);
                return;
            }
            allFiles = data || [];
            
            const urlParams = new URLSearchParams(window.location.search);
            const fileId = urlParams.get('file');
            
            if (fileId) {
                const targetFile = allFiles.find(f => f.id == fileId);
                if (targetFile) {
                    openMedia(targetFile.file_url, targetFile.name, false);
                } else {
                    alert('Publication not found.');
                    window.history.replaceState({}, document.title, window.location.pathname);
                    refreshCurrentView();
                }
            } else {
                refreshCurrentView();
            }
        }

        function refreshCurrentView() {
            if (currentViewMode === 'mypage') {
                renderMyPage();
            } else {
                renderFiles(allFiles.slice(0, 5));
            }
        }

        function renderFiles(files) {
            const listEl = document.getElementById('pdf-list');
            if (!files || files.length === 0) {
                listEl.innerHTML = `<div class="col-span-full text-center py-6 text-gray-400 text-sm">No media files found.</div>`;
                return;
            }

            listEl.innerHTML = files.map(file => {
                const isImage = /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name);
                const badgeText = isImage ? 'Image' : 'PDF';
                const badgeColor = isImage ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-blue-700 bg-blue-50 border-blue-200';
                const safeName = escapeHtml(file.name);
                const uploader = file.uploaded_by ? escapeHtml(file.uploaded_by) : 'Anonymous';

                return `
                    <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm hover:border-blue-400 hover:shadow transition flex flex-col justify-between aspect-square group">
                        <div class="flex flex-col gap-1.5">
                            <span class="text-[9px] w-fit px-2 py-0.5 rounded border font-semibold tracking-wider uppercase ${badgeColor}">${badgeText}</span>
                            <h3 class="font-medium text-gray-800 text-xs line-clamp-2 mt-1" title="${safeName}">${safeName}</h3>
                            <p class="text-[10px] text-gray-400 truncate" title="Uploaded by: ${uploader}">By: ${uploader}</p>
                        </div>
                        <button data-id="${file.id}" data-url="${file.file_url}" data-name="${safeName}" class="read-btn bg-gray-50 text-gray-700 group-hover:bg-blue-600 group-hover:text-white text-xs py-2 rounded-xl transition font-medium border border-gray-200 group-hover:border-blue-600 w-full cursor-pointer">
                            View
                        </button>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.read-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const fileId = btn.getAttribute('data-id');
                    openMedia(btn.getAttribute('data-url'), btn.getAttribute('data-name'), true, fileId);
                });
            });
        }

        function renderMyPage() {
            currentViewMode = 'mypage';
            document.getElementById('view-title').textContent = 'My Publications';
            document.getElementById('view-subtitle').textContent = currentUserEmail || '';
            document.getElementById('search-container').classList.add('hidden');

            const myFiles = allFiles.filter(f => f.uploaded_by === currentUserEmail);
            const listEl = document.getElementById('pdf-list');

            if (myFiles.length === 0) {
                listEl.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 text-sm">You haven't uploaded any publications yet.</div>`;
                return;
            }

            listEl.innerHTML = myFiles.map(file => {
                const isImage = /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name);
                const badgeText = isImage ? 'Image' : 'PDF';
                const badgeColor = isImage ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-blue-700 bg-blue-50 border-blue-200';
                const safeName = escapeHtml(file.name);

                return `
                    <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm hover:border-blue-400 hover:shadow transition flex flex-col justify-between aspect-square group">
                        <div class="flex flex-col gap-1.5">
                            <span class="text-[9px] w-fit px-2 py-0.5 rounded border font-semibold tracking-wider uppercase ${badgeColor}">${badgeText}</span>
                            <h3 class="font-medium text-gray-800 text-xs line-clamp-2 mt-1" title="${safeName}">${safeName}</h3>
                        </div>
                        <button data-id="${file.id}" data-url="${file.file_url}" data-name="${safeName}" class="read-btn bg-gray-50 text-gray-700 group-hover:bg-blue-600 group-hover:text-white text-xs py-2 rounded-xl transition font-medium border border-gray-200 group-hover:border-blue-600 w-full cursor-pointer">
                            View
                        </button>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.read-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const fileId = btn.getAttribute('data-id');
                    openMedia(btn.getAttribute('data-url'), btn.getAttribute('data-name'), true, fileId);
                });
            });
        }

        function switchToHome() {
            currentViewMode = 'home';
            document.getElementById('view-title').textContent = 'MEDIA CUBE';
            document.getElementById('view-subtitle').textContent = 'Powered by COSMOS';
            document.getElementById('search-container').classList.remove('hidden');
            renderFiles(allFiles.slice(0, 5));
        }

        document.getElementById('mypage-btn').addEventListener('click', () => {
            window.history.replaceState({}, document.title, window.location.pathname);
            renderMyPage();
        });

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (query.trim() === '') {
                filesSection.classList.add('opacity-0', 'pointer-events-none');
            } else {
                filesSection.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
                const filtered = allFiles.filter(file => file.name.toLowerCase().includes(query));
                renderFiles(filtered);
            }
        });

        document.getElementById('file-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const { data: { session } } = await supabase.auth.getSession();
            if (!session || !isValidNlcsEmail(session.user.email)) {
                alert('Access denied: You must be logged in with an @nlcsjeju.kr or @pupils.nlcsjeju.kr account to upload.');
                e.target.value = '';
                return;
            }

            const fileExists = allFiles.some(f => f.name.toLowerCase() === file.name.toLowerCase());
            if (fileExists) {
                alert('This file already exists in the library. Duplicate uploads are not allowed.');
                e.target.value = '';
                return;
            }

            const userEmail = session.user.email;
            const sanitizedName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
            const filePath = `${Date.now()}_${sanitizedName}`;

            const { error: uploadError } = await supabase.storage.from('pdfs').upload(filePath, file);
            if (uploadError) {
                alert('Upload failed: ' + uploadError.message);
                e.target.value = '';
                return;
            }

            const { data: publicUrlData } = supabase.storage.from('pdfs').getPublicUrl(filePath);
            const { error: dbError } = await supabase.from('pdf_files').insert([{
                name: file.name,
                file_url: publicUrlData.publicUrl,
                uploaded_by: userEmail
            }]);

            if (dbError) {
                alert('Database save failed: ' + dbError.message);
                e.target.value = '';
                return;
            }

            e.target.value = '';
            loadPublicLibrary();
        });

        async function openMedia(url, name, updateHistory = true, fileId = null) {
            document.getElementById('homescreen-view').classList.add('hidden');
            document.getElementById('reader-view').classList.remove('hidden');
            document.getElementById('reader-view').classList.add('flex');

            if (updateHistory && fileId) {
                const newUrl = `${window.location.pathname}?file=${fileId}`;
                window.history.pushState({ fileId }, '', newUrl);
            }

            const isImage = /\.(jpg|jpeg|png|webp|gif)$/i.test(name);

            if (isImage) {
                canvasLeft.parentElement.classList.add('hidden');
                document.getElementById('floating-prev').classList.add('hidden');
                document.getElementById('floating-next').classList.add('hidden');
                imgElement.src = url;
                imgElement.classList.remove('hidden');
                document.getElementById('navigation-controls').classList.add('hidden');
            } else {
                imgElement.classList.add('hidden');
                canvasLeft.parentElement.classList.remove('hidden');
                document.getElementById('navigation-controls').classList.remove('hidden');
                document.getElementById('navigation-controls').classList.add('flex');
                document.getElementById('floating-prev').classList.remove('hidden');
                document.getElementById('floating-prev').classList.add('flex');
                document.getElementById('floating-next').classList.remove('hidden');
                document.getElementById('floating-next').classList.add('flex');

                const loadingTask = pdfjsLib.getDocument(url);
                pdfDoc = await loadingTask.promise;
                document.getElementById('total-pages').textContent = pdfDoc.numPages;
                pageNum = 1;
                renderPDFPagePair(pageNum);
            }
        }

        async function renderPDFPagePair(num) {
            document.getElementById('current-page').textContent = num;
            const rightNum = num + 1 <= pdfDoc.numPages ? num + 1 : null;
            document.getElementById('current-page-right').textContent = rightNum || num;

            if (rightNum) {
                canvasRight.classList.remove('hidden');
                document.getElementById('current-page-right').parentElement.style.display = 'inline';
            } else {
                canvasRight.classList.add('hidden');
            }

            const page1 = await pdfDoc.getPage(num);
            const viewport1 = page1.getViewport({ scale: 1.5 });
            canvasLeft.height = viewport1.height;
            canvasLeft.width = viewport1.width;
            await page1.render({ canvasContext: ctxLeft, viewport: viewport1 }).promise;

            if (rightNum) {
                const page2 = await pdfDoc.getPage(rightNum);
                const viewport2 = page2.getViewport({ scale: 1.5 });
                canvasRight.height = viewport2.height;
                canvasRight.width = viewport2.width;
                await page2.render({ canvasContext: ctxRight, viewport: viewport2 }).promise;
            }

            document.getElementById('prev-page').disabled = (num <= 1);
            document.getElementById('floating-prev').disabled = (num <= 1);
            document.getElementById('next-page').disabled = (num + 2 > pdfDoc.numPages);
            document.getElementById('floating-next').disabled = (num + 2 > pdfDoc.numPages);
        }

        function changePage(offset) {
            if (!pdfDoc) return;
            const newPage = pageNum + offset;
            if (newPage >= 1 && newPage <= pdfDoc.numPages) {
                pageNum = newPage;
                renderPDFPagePair(pageNum);
            }
        }

        document.getElementById('prev-page').addEventListener('click', () => changePage(-2));
        document.getElementById('next-page').addEventListener('click', () => changePage(2));
        document.getElementById('floating-prev').addEventListener('click', () => changePage(-2));
        document.getElementById('floating-next').addEventListener('click', () => changePage(2));

        document.getElementById('home-btn').addEventListener('click', () => {
            window.history.replaceState({}, document.title, window.location.pathname);
            document.getElementById('reader-view').classList.add('hidden');
            document.getElementById('reader-view').classList.remove('flex');
            document.getElementById('homescreen-view').classList.remove('hidden');
            document.getElementById('navigation-controls').classList.add('hidden');
            document.getElementById('floating-prev').classList.add('hidden');
            document.getElementById('floating-next').classList.add('hidden');
            refreshCurrentView();
        });

        window.addEventListener('popstate', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileId = urlParams.get('file');
            if (!fileId) {
                document.getElementById('reader-view').classList.add('hidden');
                document.getElementById('reader-view').classList.remove('flex');
                document.getElementById('homescreen-view').classList.remove('hidden');
                document.getElementById('navigation-controls').classList.add('hidden');
                document.getElementById('floating-prev').classList.add('hidden');
                document.getElementById('floating-next').classList.add('hidden');
                refreshCurrentView();
            }
        });

        checkUserSession();
        loadPublicLibrary();
    </script>
</body>
</html>
