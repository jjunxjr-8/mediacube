<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Tag-Sorted Content List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4 sm:px-6 lg:px-8">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900">Content Library</h1>
            <p class="text-slate-600 mt-2">Filter and sort articles by their tags.</p>
        </header>

        <div class="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 gap-4">
            <div id="tag-filters" class="flex flex-wrap gap-2">
                </div>

            <div class="w-full sm:w-auto">
                <select id="sort-select" class="w-full sm:w-auto border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="default">Sort By</option>
                    <option value="title-asc">Title (A - Z)</option>
                    <option value="title-desc">Title (Z - A)</option>
                </select>
            </div>
        </div>

        <div id="content-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>
    </div>

    <script>
        let allData = [];
        let currentTag = 'All';
        let currentSort = 'default';

        const container = document.getElementById('content-container');
        const tagFiltersContainer = document.getElementById('tag-filters');
        const sortSelect = document.getElementById('sort-select');

        // Fetch JSON data on page load
        async function loadContent() {
            try {
                const response = await fetch('content.json');
                if (!response.ok) throw new Error('Failed to load JSON data');
                allData = await response.json();
                
                generateTagFilters();
                renderAndSort();
            } catch (error) {
                container.innerHTML = `<p class="text-red-500 col-span-2 text-center">Error loading content: ${error.message}. Make sure you are running via a local server (e.g., Live Server).</p>`;
            }
        }

        // Dynamically create tag filter buttons based on JSON contents
        function generateTagFilters() {
            const tags = ['All', ...new Set(allData.map(item => item.tag))];
            
            tagFiltersContainer.innerHTML = tags.map(tag => `
                <button onclick="setTag('${tag}')" 
                    class="px-4 py-1.5 rounded-lg text-sm font-medium transition-colors ${
                        currentTag === tag 
                        ? 'bg-blue-600 text-white shadow-sm' 
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }">
                    ${tag}
                </button>
            `).join('');
        }

        // Filter and Sort Handler
        function renderAndSort() {
            // 1. Filter by Tag
            let filtered = currentTag === 'All' 
                ? [...allData] 
                : allData.filter(item => item.tag === currentTag);

            // 2. Sort Items
            if (currentSort === 'title-asc') {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            } else if (currentSort === 'title-desc') {
                filtered.sort((a, b) => b.title.localeCompare(a.title));
            }

            // 3. Render to DOM
            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-slate-500 col-span-2 text-center py-8">No content found for this tag.</p>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition-shadow">
                    <div>
                        <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 mb-2">
                            ${item.tag}
                        </span>
                        <h2 class="text-lg font-bold text-slate-900">${item.title}</h2>
                        <p class="text-slate-600 text-sm mt-1">${item.description}</p>
                    </div>
                </div>
            `).join('');
        }

        // Update tag state and refresh UI
        window.setTag = function(tag) {
            currentTag = tag;
            generateTagFilters();
            renderAndSort();
        }

        // Listen to sort dropdown changes
        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderAndSort();
        });

        // Initialize script
        loadContent();
    </script>
</body>
</html>
